[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tsql-fabric-debugger"
version = "0.2.0"
description = "Step-by-step debugger for T-SQL stored procedures on the Microsoft Fabric Warehouse"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "RedRex" }]
keywords = ["fabric", "tsql", "debugger", "warehouse", "microsoft-fabric", "sql-server"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Debuggers",
]
dependencies = ["pyodbc>=5.0"]

[project.optional-dependencies]
local = ["azure-identity>=1.15"]
pandas = ["pandas>=2.0"]
all = ["azure-identity>=1.15", "pandas>=2.0", "sqlparse>=0.5"]
dev = ["pytest>=8.0", "azure-identity>=1.15", "pandas>=2.0", "mutmut>=3.2"]

[project.scripts]
tsql-debug = "tsql_fabric_debugger.cli:main"

[project.urls]
Homepage = "https://github.com/redrex-tech/tsql_fabric_debugger"

[tool.hatch.build.targets.wheel]
packages = ["src/tsql_fabric_debugger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a real Fabric Warehouse (FABRIC_TSQL_SERVER/DATABASE)"]

[tool.mutmut]
# Mutation testing only on the pure modules, fully covered by the offline
# suite. engine/connection/runner/cli need a real Warehouse (env-gated
# integration tests), so mutants there would survive for lack of an
# environment, not lack of a test.
source_paths = ["src/tsql_fabric_debugger"]
do_not_mutate = [
    "src/tsql_fabric_debugger/__init__.py",
    "src/tsql_fabric_debugger/engine.py",
    "src/tsql_fabric_debugger/connection.py",
    "src/tsql_fabric_debugger/runner.py",
    "src/tsql_fabric_debugger/cli.py",
]
pytest_add_cli_args_test_selection = ["tests/"]
