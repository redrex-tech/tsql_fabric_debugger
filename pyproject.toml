[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tsql-fabric-debugger"
version = "0.3.3"
description = "Step-by-step debugger for T-SQL stored procedures on the Microsoft Fabric Warehouse"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "RedRex" }]
keywords = ["fabric", "tsql", "debugger", "warehouse", "microsoft-fabric", "sql-server"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Debuggers",
    "Typing :: Typed",
]
dependencies = ["pyodbc>=5.0"]

[project.optional-dependencies]
local = ["azure-identity>=1.15"]
pandas = ["pandas>=2.0"]
all = ["azure-identity>=1.15", "pandas>=2.0", "sqlparse>=0.5"]
dev = ["pytest>=8.0", "azure-identity>=1.15", "pandas>=2.0", "mutmut>=3.2"]

[project.scripts]
tsql-debug = "tsql_fabric_debugger.cli:main"
tsql-fabric-dap = "tsql_fabric_debugger.dap:main"
tsql-fabric-introspect = "tsql_fabric_debugger.introspect:main"

[project.urls]
Homepage = "https://github.com/redrex-tech/tsql_fabric_debugger"
Repository = "https://github.com/redrex-tech/tsql_fabric_debugger"
Documentation = "https://github.com/redrex-tech/tsql_fabric_debugger/blob/main/docs/DOCUMENTATION.md"
Changelog = "https://github.com/redrex-tech/tsql_fabric_debugger/blob/main/CHANGELOG.md"
Issues = "https://github.com/redrex-tech/tsql_fabric_debugger/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tsql_fabric_debugger"]

[tool.hatch.build.targets.sdist]
# Keep the source distribution lean: the Python package, its tests and docs.
# Without this, Hatchling sweeps in editors/vscode/node_modules (~45 MB) —
# nested .gitignores are not honored, so exclude the whole VS Code tree here.
include = [
    "src/tsql_fabric_debugger",
    "tests",
    "docs",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]
exclude = [
    "editors",
    "**/node_modules",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a real Fabric Warehouse (FABRIC_TSQL_SERVER/DATABASE)"]

[tool.mutmut]
# Mutation testing over scanner, parser AND engine — the engine is now
# exercised offline through a fake pyodbc session (tests/conftest.py), so its
# logic (capture, state, error routing, CATCH, breakpoints, child EXEC) is
# mutation-tested without a warehouse. connection/runner/cli remain excluded:
# they are thin glue whose real behavior needs the driver/warehouse.
source_paths = ["src/tsql_fabric_debugger"]
do_not_mutate = [
    "src/tsql_fabric_debugger/__init__.py",
    "src/tsql_fabric_debugger/connection.py",
    "src/tsql_fabric_debugger/runner.py",
    "src/tsql_fabric_debugger/cli.py",
]
pytest_add_cli_args_test_selection = ["tests/"]
